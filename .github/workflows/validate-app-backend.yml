name: Validate App Backend

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
    paths:
      - "apps/backend/**"
      - ".github/workflows/validate-app-backend.yml"

env:
  CARGO_TERM_COLOR: always
  # Important: Force SQLx to run in offline mode
  SQLX_OFFLINE: true
  WORKING_DIRECTORY: apps/backend

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  quality-check:
    name: Quality Check (Lint & Format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            apps/backend

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKING_DIRECTORY }}
          shared-key: backend

      - name: Check formatting
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: cargo clippy -- -D warnings

  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    needs: quality-check
    environment: Validate App Backend
    env:
      APP_ENV: ${{ vars.APP_ENV }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      DYNAMODB_TABLE_SESSIONS: ${{ vars.DYNAMODB_TABLE_SESSIONS }}
      DYNAMODB_TABLE_VERIFICATIONS: ${{ vars.DYNAMODB_TABLE_VERIFICATIONS }}
      JWT_ACCESS_SECRET: ${{ vars.JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ vars.JWT_REFRESH_SECRET }}
      POSTHOG_API_KEY: ${{ vars.POSTHOG_API_KEY }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            apps/backend

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKING_DIRECTORY }}
          shared-key: backend-llvm-cov

      - name: Generate coverage report
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          cargo llvm-cov nextest \
            --ignore-filename-regex "main\.rs|routes\.rs|state\.rs|entities/.*|bin/.*|modules/.*/(repository|handler|route|dto)\.rs" \
            -E "not test(/modules::/) or test(/modules::.*::service/)" \
            --lcov --output-path lcov.info

      - name: Check minimum coverage
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          LF=$(grep -E "^LF:" lcov.info | awk -F: '{sum += $2} END {print sum}')
          LH=$(grep -E "^LH:" lcov.info | awk -F: '{sum += $2} END {print sum}')
          COVERAGE=$(awk "BEGIN {printf \"%.1f\", $LH/$LF * 100}")
          echo "Coverage: $COVERAGE%"
          if awk "BEGIN {exit !($COVERAGE < 70)}"; then
            echo "Error: coverage $COVERAGE% is below minimum 70%"
            exit 1
          fi

      - name: Report coverage to PR
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          lcov-file: ${{ env.WORKING_DIRECTORY }}/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          delete-old-comments: true

  build-lambda:
    name: Build AWS Lambda (ARM64)
    runs-on: ubuntu-latest
    environment: Validate App Backend
    env:
      APP_ENV: ${{ vars.APP_ENV }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      DYNAMODB_TABLE_SESSIONS: ${{ vars.DYNAMODB_TABLE_SESSIONS }}
      DYNAMODB_TABLE_VERIFICATIONS: ${{ vars.DYNAMODB_TABLE_VERIFICATIONS }}
      JWT_ACCESS_SECRET: ${{ vars.JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ vars.JWT_REFRESH_SECRET }}
      POSTHOG_API_KEY: ${{ vars.POSTHOG_API_KEY }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}

    needs: quality-check
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            apps/backend

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install Cargo Lambda (Fast)
        uses: taiki-e/install-action@cargo-lambda

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKING_DIRECTORY }}
          shared-key: backend-aarch64

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Build Binary
        working-directory: ${{ env.WORKING_DIRECTORY }}
        # Build for ARM64 to optimize AWS Lambda costs
        run: cargo lambda build --release --arm64
